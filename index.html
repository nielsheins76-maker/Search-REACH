<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemChecker Pro | Comfort Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f4ff',
                            100: '#d9e2ff',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        body { 
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease;
        }

        .mono-font { font-family: 'JetBrains Mono', monospace; }

        /* Zachte overgangen voor Dark Mode */
        .dark-transition {
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Glassmorphism effecten */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.7);
        }

        @media print {
            .no-print { display: none !important; }
            body { background-color: white !important; color: black !important; }
            .print-card { border: 1px solid #e2e8f0 !important; break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
            Search, AlertTriangle, CheckCircle, Ban, Users, Info, 
            ShieldCheck, Eraser, FileText, Upload, Trash2, BookOpen, X,
            ClipboardCheck, HardDrive, Loader2, Moon, Sun, Download, ChevronRight
        } from 'https://esm.sh/lucide-react@0.263.1';

        const db = new Dexie("ChemCheckerDB");
        db.version(2).stores({
            settings: 'id, value',
            substances: '++id, cas, name, listId'
        });

        const regulatoryInfo = {
            "annex xvii": { 
                category: "prohibited", 
                title: "REACH Annex XVII", 
                description: "Beperkingen op vervaardiging, handel en gebruik van gevaarlijke stoffen.", 
                implication: "KRITIEK: Gebruik vaak verboden of aan strikte voorwaarden gebonden.", 
                paperwork: "Statement of Compliance (SoC).", 
                riskColor: "text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/20 border-rose-100 dark:border-rose-900/30" 
            },
            "pop": { 
                category: "prohibited", 
                title: "POPs Verordening", 
                description: "Stoffen die zeer lang in het milieu blijven en zich ophopen.", 
                implication: "STRIKT VERBOD: Fabricage en gebruik zijn niet toegestaan.", 
                paperwork: "Leveranciersverklaring.", 
                riskColor: "text-red-700 dark:text-red-400 bg-red-50 dark:bg-red-900/20 border-red-100 dark:border-red-900/30" 
            },
            "annex xiv": { 
                category: "warning", 
                title: "REACH Annex XIV", 
                description: "Autorisatielijst voor zeer zorgwekkende stoffen.", 
                implication: "AUTORISATIE: Gebruik alleen toegestaan met specifieke vergunning.", 
                paperwork: "Autorisatienummer.", 
                riskColor: "text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20 border-amber-100 dark:border-amber-900/30" 
            },
            "svhc": { 
                category: "watch", 
                title: "SVHC Kandidaatslijst", 
                description: "Stoffen geïdentificeerd als potentieel zeer zorgwekkend.", 
                implication: "MELDINGSPLICHT: Communicatie vereist bij concentratie > 0,1%.", 
                paperwork: "Artikel 33 Verklaring.", 
                riskColor: "text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20 border-blue-100 dark:border-blue-900/30" 
            }
        };

        const App = () => {
            const [isDark, setIsDark] = useState(false);
            const [inputText, setInputText] = useState("");
            const [results, setResults] = useState([]);
            const [dbLoaded, setDbLoaded] = useState(false);
            const [recordCount, setRecordCount] = useState(0);
            const [isLoading, setIsLoading] = useState(true);
            const [loadingMessage, setLoadingMessage] = useState("");
            const [activeGuide, setActiveGuide] = useState(null);

            useEffect(() => {
                const init = async () => {
                    const count = await db.substances.count();
                    setRecordCount(count);
                    setDbLoaded(count > 0);
                    setIsLoading(false);
                    
                    // Check systeemvoorkeur voor dark mode
                    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        setIsDark(true);
                    }
                };
                init();
            }, []);

            useEffect(() => {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDark]);

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                setIsLoading(true);
                setLoadingMessage("Data wordt lokaal verwerkt...");

                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        let rawData = Array.isArray(json) ? json : (json.data || []);
                        
                        const normalized = rawData.map(item => ({
                            cas: String(item.cas || item["CAS No"] || "").replace(/[\s\u00A0]/g, "").toLowerCase(),
                            name: item.name || item["Substance Name"] || "Onbekend",
                            listId: item.listId || item["List Name"] || "Onbekend",
                            ec: item.ec || "",
                            note: item.note || ""
                        })).filter(i => i.cas);

                        await db.substances.clear();
                        await db.substances.bulkAdd(normalized);
                        setRecordCount(normalized.length);
                        setDbLoaded(true);
                        await db.settings.put({id: "uploadDate", value: new Date().toLocaleDateString()});
                    } catch (err) { alert("Fout bij laden: " + err.message); }
                    finally { setIsLoading(false); }
                };
                reader.readAsText(file);
            };

            const handleSearch = async () => {
                if (!inputText.trim()) return;
                setIsLoading(true);
                setLoadingMessage("Zoeken in database...");

                const queries = inputText.split(/[\n,;]+/).map(q => q.trim().toLowerCase().replace(/[\s\u00A0]/g, "")).filter(q => q);
                const matches = await db.substances.where('cas').anyOf(queries).toArray();

                const finalResults = queries.map(q => {
                    const substanceMatches = matches.filter(m => m.cas === q);
                    if (substanceMatches.length > 0) {
                        return {
                            cas: q,
                            name: substanceMatches[0].name,
                            found: true,
                            entries: substanceMatches
                        };
                    }
                    return { cas: q, found: false, entries: [] };
                });

                setResults(finalResults);
                setIsLoading(false);
            };

            const getRiskLevel = (listId) => {
                const id = listId.toLowerCase();
                if (id.includes('pop') || id.includes('xvii')) return 'prohibited';
                if (id.includes('xiv') || id.includes('vi')) return 'warning';
                if (id.includes('svhc') || id.includes('candidate')) return 'watch';
                return 'low';
            };

            const getStyles = (level) => {
                switch(level) {
                    case 'prohibited': return { color: 'rose', icon: <Ban size={18}/>, label: 'Beperkt' };
                    case 'warning': return { color: 'amber', icon: <AlertTriangle size={18}/>, label: 'Autorisatie' };
                    case 'watch': return { color: 'blue', icon: <Users size={18}/>, label: 'SVHC' };
                    default: return { color: 'emerald', icon: <CheckCircle size={18}/>, label: 'Veilig' };
                }
            };

            if (isLoading) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950">
                    <div className="text-center">
                        <Loader2 className="w-10 h-10 animate-spin text-brand-600 mx-auto mb-4" />
                        <p className="font-medium text-slate-600 dark:text-slate-400">{loadingMessage}</p>
                    </div>
                </div>
            );

            return (
                <div className="dark-transition">
                    {/* TOP NAV */}
                    <header className="glass-panel border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-brand-600 p-2 rounded-lg shadow-lg">
                                    <ShieldCheck className="text-white" size={20} />
                                </div>
                                <h1 className="font-bold text-lg hidden sm:block">ChemChecker <span className="text-brand-600">Pro</span></h1>
                            </div>

                            <div className="flex items-center gap-4">
                                <div className="hidden md:flex items-center gap-2 text-xs font-semibold text-slate-500 bg-slate-100 dark:bg-slate-900 px-3 py-1.5 rounded-full border border-slate-200 dark:border-slate-800">
                                    <HardDrive size={14} /> {recordCount.toLocaleString()} Stoffen
                                </div>
                                <button 
                                    onClick={() => setIsDark(!isDark)}
                                    className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors"
                                >
                                    {isDark ? <Sun size={20} className="text-amber-400"/> : <Moon size={20} className="text-slate-600"/>}
                                </button>
                                {dbLoaded && (
                                    <button onClick={() => {if(confirm("Wissen?")) db.substances.clear().then(() => location.reload())}} className="p-2 text-slate-400 hover:text-rose-500 transition-colors">
                                        <Trash2 size={20} />
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-6 py-12 space-y-12">
                        {!dbLoaded ? (
                            <div className="text-center py-20 space-y-6">
                                <div className="bg-brand-50 dark:bg-brand-900/10 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6">
                                    <Upload className="text-brand-600" size={32} />
                                </div>
                                <h2 className="text-2xl font-bold">Welkom bij ChemChecker</h2>
                                <p className="text-slate-500 dark:text-slate-400 max-w-sm mx-auto">Upload uw REACH databasebestand om te beginnen. Uw data blijft veilig in uw eigen browser.</p>
                                <label className="inline-flex items-center gap-2 bg-brand-600 text-white px-8 py-4 rounded-2xl font-bold shadow-xl shadow-brand-200 dark:shadow-none hover:bg-brand-700 transition-all cursor-pointer">
                                    <Upload size={20} /> Kies JSON Bestand
                                    <input type="file" className="hidden" accept=".json" onChange={handleFileUpload} />
                                </label>
                            </div>
                        ) : (
                            <>
                                {/* SEARCH SECTION */}
                                <section className="no-print">
                                    <div className="bg-white dark:bg-slate-900 rounded-[2rem] p-8 shadow-sm border border-slate-200 dark:border-slate-800">
                                        <div className="flex items-center gap-2 text-brand-600 text-xs font-bold uppercase tracking-widest mb-4">
                                            <Search size={14} /> Snelle Analyse
                                        </div>
                                        <textarea 
                                            className="w-full min-h-[120px] p-6 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl focus:ring-2 focus:ring-brand-600 focus:border-transparent outline-none transition-all mono-font text-sm leading-relaxed"
                                            placeholder="Plak CAS-nummers (bijv: 67-64-1, 1330-20-7)"
                                            value={inputText}
                                            onChange={(e) => setInputText(e.target.value)}
                                        />
                                        <div className="mt-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                                            <p className="text-xs text-slate-400">Gebruik komma's of nieuwe regels voor meerdere stoffen.</p>
                                            <button 
                                                onClick={handleSearch}
                                                className="w-full sm:w-auto bg-brand-600 text-white px-10 py-3.5 rounded-xl font-bold shadow-lg shadow-brand-100 dark:shadow-none hover:translate-y-[-1px] active:translate-y-[0px] transition-all flex items-center justify-center gap-2"
                                            >
                                                Start Scan <ChevronRight size={18} />
                                            </button>
                                        </div>
                                    </div>
                                </section>

                                {/* RESULTS SECTION */}
                                {results.length > 0 && (
                                    <section className="space-y-6">
                                        <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
                                            <h3 className="text-xl font-bold">Resultaten</h3>
                                            <button onClick={() => window.print()} className="no-print text-sm font-semibold flex items-center gap-2 text-slate-500 hover:text-brand-600 transition-colors">
                                                <Download size={16} /> Rapport Downloaden
                                            </button>
                                        </div>

                                        <div className="grid gap-4">
                                            {results.map((item, idx) => {
                                                const highestRisk = item.entries.length > 0 ? getRiskLevel(item.entries[0].listId) : 'none';
                                                const style = getStyles(highestRisk);

                                                return (
                                                    <div key={idx} className="print-card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow">
                                                        <div className="p-6">
                                                            <div className="flex flex-col md:flex-row justify-between gap-4">
                                                                <div className="flex items-start gap-4">
                                                                    <div className={`mt-1 p-2 rounded-lg bg-${style.color}-50 dark:bg-${style.color}-900/20 text-${style.color}-600 dark:text-${style.color}-400 shrink-0`}>
                                                                        {style.icon}
                                                                    </div>
                                                                    <div>
                                                                        <div className="mono-font text-lg font-bold">{item.cas}</div>
                                                                        <div className="text-sm text-slate-500 dark:text-slate-400 font-medium">{item.found ? item.name : "Niet gevonden in lokale database"}</div>
                                                                    </div>
                                                                </div>
                                                                <div className={`self-start px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-tighter border border-${style.color}-200 dark:border-${style.color}-800 text-${style.color}-600 dark:text-${style.color}-400`}>
                                                                    {item.found ? style.label : 'Geen Data'}
                                                                </div>
                                                            </div>

                                                            {item.found && (
                                                                <div className="mt-6 grid gap-3">
                                                                    {item.entries.map((entry, eIdx) => {
                                                                        const info = regulatoryInfo[Object.keys(regulatoryInfo).find(k => entry.listId.toLowerCase().includes(k))] || null;
                                                                        return (
                                                                            <div key={eIdx} className="bg-slate-50 dark:bg-slate-950/50 p-4 rounded-xl border border-slate-100 dark:border-slate-800/50">
                                                                                <div className="flex justify-between items-center mb-2">
                                                                                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400">{entry.listId}</span>
                                                                                    <span className="text-[10px] mono-font text-slate-400">EC: {entry.ec || "-"}</span>
                                                                                </div>
                                                                                {info && (
                                                                                    <div className="grid sm:grid-cols-2 gap-4 mt-3">
                                                                                        <div className="space-y-1">
                                                                                            <div className="text-[10px] font-bold text-slate-400 uppercase">Implicatie</div>
                                                                                            <p className="text-xs leading-relaxed">{info.implication}</p>
                                                                                        </div>
                                                                                        <div className="space-y-1">
                                                                                            <div className="text-[10px] font-bold text-slate-400 uppercase">Documentatie</div>
                                                                                            <p className="text-xs leading-relaxed">{info.paperwork}</p>
                                                                                        </div>
                                                                                    </div>
                                                                                )}
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </section>
                                )}
                            </>
                        )}
                    </main>

                    <footer className="py-12 border-t border-slate-200 dark:border-slate-900 text-center no-print">
                        <div className="max-w-4xl mx-auto px-6">
                            <h4 className="font-bold text-slate-800 dark:text-slate-200">ADDEV Materials Aerospace B.V.</h4>
                            <p className="text-xs text-slate-500 mt-2">HSE Compliance Tool • Beheer door: N. Heins, HSE, CCSE, Product Safety Specialist, CESGM</p>
                            
                            <div className="mt-8 p-4 sm:p-5 bg-slate-100/80 dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-800 text-[10px] sm:text-xs text-slate-500 dark:text-slate-400 max-w-3xl mx-auto leading-relaxed text-left sm:text-center shadow-sm">
                                <strong className="text-slate-700 dark:text-slate-300">Disclaimer:</strong> Deze online applicatie is ontwikkeld als informatief hulpmiddel voor snelle referentie. Het is nadrukkelijk <em>geen</em> vervanging van officiële bronnen en publicaties, zoals die van het Europees Agentschap voor chemische stoffen (ECHA) of de actuele REACH-wetgeving. Raadpleeg voor bindende juridische- of compliancebeslissingen altijd de officiële instanties.
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
